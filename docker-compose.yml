# SQS local (moto) e Postgres para o teste/testar.sh.
#   docker compose up -d --wait
services:
  sqs:
    image: motoserver/moto:5.2.5
    environment:
      MOTO_ACCOUNT_ID: "111122223333"
    ports:
      - "5005:5000"

  postgres:
    image: postgres:16
    command: postgres -c timezone=America/Sao_Paulo
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dlq
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dlq"]
      interval: 2s
      timeout: 3s
      retries: 30
